<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>MixMarkt Base — учёт сроков</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="/app/static/html5-qrcode.min.js"></script>
<style>
  /* ===== MixMarkt Base — фирменные цвета магазина: голубой и жёлтый =====
     Синий — основной (шапка, кнопки), жёлтый — акценты (логотип, главная кнопка, подсветка).
     Смысловые цвета не трогаем: зелёный — в порядке, оранжевый — уценить, красный — списать. */
  :root, [data-theme="light"] {
    --bg: #f2f5fa;
    --card: #ffffff;
    --card-2: #f4f7fc;
    --text: #0f1b2e;
    --hint: #67768c;
    --sep: #e1e7f0;
    --accent: #1d63d6;
    --accent-2: #174fb0;
    --accent-soft: #e3ecfb;
    --on-accent: #ffffff;
    --yellow: #ffcc1a; --yellow-soft: #fff4cc; --yellow-ink: #8a6500; --on-yellow: #172238;
    --green: #1f9d57;  --green-soft: #e1f5ea;
    --orange: #ea7a0b; --orange-soft: #ffefdc;
    --red: #dc3d43;    --red-soft: #fde8e8;
    --violet: #7b5cf0; --violet-soft: #eeeaff;
    --teal: #0f9b8e;   --teal-soft: #dcf5f2;
    --gray: #8a94a3;   --gray-soft: #eef1f6;
    --shadow: 0 1px 2px rgba(15,27,46,.05), 0 6px 18px rgba(15,27,46,.07);
    --hero-top: #1f6ae0;
    --hero: linear-gradient(140deg, #1f6ae0 0%, #1a55c2 55%, #143f96 100%);
  }
  [data-theme="light"] { color-scheme: light; }
  [data-theme="dark"] {
    color-scheme: dark;
    --bg: #0b111d;
    --card: #141c2b;
    --card-2: #1a2436;
    --text: #e8eef8;
    --hint: #8b98ae;
    --sep: #232f45;
    --accent: #4f8fff;
    --accent-2: #3a78e8;
    --accent-soft: rgba(79,143,255,.16);
    --on-accent: #ffffff;
    --yellow: #ffd43b; --yellow-soft: rgba(255,212,59,.15); --yellow-ink: #ffd43b; --on-yellow: #172238;
    --green: #34c27a;  --green-soft: rgba(52,194,122,.15);
    --orange: #f59a3a; --orange-soft: rgba(245,154,58,.15);
    --red: #f0595e;    --red-soft: rgba(240,89,94,.15);
    --violet: #9b85ff; --violet-soft: rgba(155,133,255,.16);
    --teal: #34c3b5;   --teal-soft: rgba(52,195,181,.15);
    --gray: #8b98ae;   --gray-soft: rgba(139,152,174,.14);
    --shadow: 0 1px 2px rgba(0,0,0,.35);
    --hero-top: #1d4fb0;
    --hero: linear-gradient(140deg, #1d4fb0 0%, #163f8f 60%, #102f6d 100%);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased; }
  body { padding: 0 0 calc(28px + env(safe-area-inset-bottom)); }
  .hidden { display: none !important; }
  svg.i { width: 20px; height: 20px; flex: none; stroke: currentColor; fill: none; stroke-width: 2;
    stroke-linecap: round; stroke-linejoin: round; vertical-align: middle; }
  button { font-family: inherit; }
  button:active, .item:active, .stat:active { transform: scale(.98); }
  button, .item, .stat { transition: transform .12s ease, background-color .15s ease, border-color .15s ease; }

  /* шапка */
  .hero { background: var(--hero); color: #fff; padding: 18px 16px 54px; border-radius: 0 0 26px 26px;
    position: relative; overflow: hidden; }
  .hero::before { content: ""; position: absolute; width: 170px; height: 170px; right: -70px; top: -104px;
    border-radius: 50%; background: var(--yellow); opacity: .95; }
  .hero::after { content: ""; position: absolute; width: 110px; height: 110px; right: 64px; top: -78px;
    border-radius: 50%; border: 14px solid rgba(255,255,255,.12); }
  .hero > * { position: relative; z-index: 1; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .logo { width: 46px; height: 46px; border-radius: 15px; background: var(--yellow);
    display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 12px rgba(0,0,0,.18); }
  .logo svg.i { width: 25px; height: 25px; stroke: #143f96; stroke-width: 2.2; }
  .brand h1 span { color: var(--yellow); }
  .brand h1 { margin: 0; font-size: 22px; letter-spacing: -.01em; }
  .brand .sub { font-size: 13px; opacity: .8; margin-top: 1px; }
  .hero .hello { margin-top: 14px; font-size: 14px; opacity: .92; }
  header.plain { padding: 18px 16px 6px; }
  header.plain h1 { margin: 0; font-size: 24px; letter-spacing: -.01em; }

  /* счётчики */
  .stats { position: relative; z-index: 2; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 0 16px; margin-top: -38px; }
  .stat { background: var(--card); border-radius: 18px; padding: 12px; border: 2px solid transparent;
    cursor: pointer; box-shadow: var(--shadow); }
  .stat .ico { width: 30px; height: 30px; border-radius: 10px; display: flex; align-items: center; justify-content: center; margin-bottom: 8px; }
  .stat .ico svg.i { width: 17px; height: 17px; }
  .stat b { display: block; font-size: 24px; line-height: 1; letter-spacing: -.02em; }
  .stat span { font-size: 12px; color: var(--hint); }
  .stat.active { border-color: var(--accent); }
  .stat.orange .ico { background: var(--orange-soft); color: var(--orange); }
  .stat.red .ico { background: var(--red-soft); color: var(--red); }
  .stat.green .ico { background: var(--yellow-soft); color: var(--yellow-ink); }

  /* поиск */
  .search { margin: 14px 16px 6px; position: relative; }
  .search svg.i { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--hint); width: 18px; height: 18px; }
  .search input { width: 100%; border: 1px solid var(--sep); border-radius: 14px; padding: 11px 42px 11px 40px; font-size: 16px;
    background: var(--card); color: var(--text); outline: none; font-family: inherit; }
  .search input:focus { border-color: var(--accent); }

  /* список */
  .list { padding: 4px 16px; display: flex; flex-direction: column; gap: 8px; }
  .group-title { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em;
    color: var(--hint); margin: 12px 4px 0; display: flex; justify-content: space-between; align-items: center; }
  .group-title .n { background: var(--gray-soft); color: var(--hint); border-radius: 99px; padding: 2px 8px; font-size: 11px; }
  .group-title.red { color: var(--red); } .group-title.red .n { background: var(--red-soft); color: var(--red); }
  .group-title.orange { color: var(--orange); } .group-title.orange .n { background: var(--orange-soft); color: var(--orange); }
  .item { display: flex; gap: 12px; align-items: center; background: var(--card); border-radius: 18px; padding: 10px 12px 10px 10px;
    cursor: pointer; box-shadow: var(--shadow); position: relative; overflow: hidden; }
  .item::before { content: ""; position: absolute; left: 0; top: 12px; bottom: 12px; width: 3px; border-radius: 0 3px 3px 0; background: transparent; }
  .item.s-discount::before { background: var(--orange); } .item.s-writeoff::before { background: var(--red); }
  .item.s-discounted::before { background: var(--violet); }
  .thumb { width: 58px; height: 58px; border-radius: 14px; object-fit: cover; background: var(--card-2); flex: none; }
  div.thumb { display: flex; align-items: center; justify-content: center; color: var(--hint); }
  .item .info { flex: 1; min-width: 0; }
  .item .title { font-weight: 650; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .qty { display: inline-block; font-size: 12px; font-weight: 700; color: var(--yellow-ink); background: var(--yellow-soft);
    border-radius: 8px; padding: 1px 6px; margin-left: 6px; vertical-align: 2px; }
  .item .meta { color: var(--hint); font-size: 13px; display: flex; align-items: center; gap: 5px; margin-top: 2px; }
  .item .meta svg.i { width: 14px; height: 14px; }
  .badge { font-size: 12px; font-weight: 700; padding: 5px 10px; border-radius: 99px; white-space: nowrap; }
  .b-ok { background: var(--green-soft); color: var(--green); }
  .b-discount { background: var(--orange-soft); color: var(--orange); }
  .b-discounted { background: var(--violet-soft); color: var(--violet); }
  .b-writeoff { background: var(--red-soft); color: var(--red); }
  .b-off { background: var(--gray-soft); color: var(--gray); }
  .b-sold { background: var(--teal-soft); color: var(--teal); }
  .item.found { border: 2px solid var(--accent); padding: 8px 10px 8px 8px;
    box-shadow: 0 0 0 4px var(--yellow-soft), var(--shadow); }
  mark { background: var(--yellow); color: var(--on-yellow); border-radius: 5px; padding: 0 3px; font-weight: 700; }
  .group-title.found-title { color: var(--accent); } .group-title.found-title .n { background: var(--accent-soft); color: var(--accent); }
  .rest { opacity: .55; display: flex; flex-direction: column; gap: 8px; }
  .not-found { display: flex; gap: 12px; align-items: center; background: var(--card); border-radius: 18px; padding: 14px;
    color: var(--hint); font-size: 14px; box-shadow: var(--shadow); margin-top: 8px; }
  .not-found svg.i { color: var(--hint); width: 22px; height: 22px; }
  .search .clear { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); border: 0; background: var(--gray-soft);
    color: var(--hint); width: 28px; height: 28px; border-radius: 50%; font-size: 16px; line-height: 1; cursor: pointer; }
  .empty { text-align: center; color: var(--hint); padding: 44px 16px 24px; }
  .empty .big { width: 64px; height: 64px; margin: 0 auto 12px; border-radius: 22px; background: var(--accent-soft);
    color: var(--accent); display: flex; align-items: center; justify-content: center; }
  .empty .big svg.i { width: 30px; height: 30px; }

  /* формы */
  .form { padding: 8px 16px; display: flex; flex-direction: column; gap: 12px; }
  .field { background: var(--card); border-radius: 18px; padding: 12px 14px; box-shadow: var(--shadow); }
  .field label { display: block; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--hint); margin-bottom: 6px; }
  .field input { width: 100%; border: 0; background: transparent; color: var(--text); font-size: 17px; outline: none; padding: 2px 0; font-family: inherit; }
  .row { display: flex; gap: 8px; align-items: center; }
  .row input { flex: 1; min-width: 0; }
  .photo-pick { position: relative; height: 210px; border-radius: 20px; background: var(--card);
    display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 8px; color: var(--accent);
    overflow: hidden; border: 2px dashed color-mix(in srgb, var(--accent) 45%, transparent); font-weight: 600; }
  .photo-pick .icon { width: 56px; height: 56px; border-radius: 18px; background: var(--accent-soft); display: flex; align-items: center; justify-content: center; }
  .photo-pick .icon svg.i { width: 28px; height: 28px; }
  .photo-pick img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .photo-pick input { position: absolute; inset: 0; opacity: 0; }
  .photo-pick .tag { position: absolute; left: 10px; bottom: 10px; z-index: 1; background: rgba(0,0,0,.6); color: #fff;
    font-size: 12px; font-weight: 500; padding: 5px 10px; border-radius: 10px; backdrop-filter: blur(6px); }
  .btn { border: 0; border-radius: 14px; padding: 13px 16px; font-size: 16px; font-weight: 650;
    background: var(--accent); color: var(--on-accent); cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .btn.small { padding: 9px 12px; font-size: 14px; border-radius: 12px; }
  .btn.ghost { background: var(--accent-soft); color: var(--accent); }
  .btn.orange { background: var(--orange); color: #fff; } .btn.red { background: var(--red); color: #fff; }
  .btn.teal { background: var(--teal); color: #fff; }
  .btn.plain { background: var(--card); color: var(--text); box-shadow: var(--shadow); }
  .btn.link { background: none; color: var(--red); font-weight: 500; font-size: 15px; }
  .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .chip { border: 0; border-radius: 99px; padding: 7px 12px; font-size: 13px; font-weight: 600; cursor: pointer;
    background: var(--accent-soft); color: var(--accent); }
  .hint { font-size: 13px; color: var(--hint); margin-top: 6px; }
  .hint.ok { color: var(--green); }
  .stepper { display: flex; align-items: center; gap: 12px; }
  .stepper button { width: 46px; height: 46px; border-radius: 14px; border: 0; font-size: 24px; font-weight: 500; line-height: 1;
    background: var(--accent-soft); color: var(--accent); cursor: pointer; }
  .stepper input { width: 80px; text-align: center; font-size: 24px; font-weight: 700; border: 0; outline: none;
    background: transparent; color: var(--text); -moz-appearance: textfield; font-family: inherit; }
  .stepper input::-webkit-inner-spin-button, .stepper input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  input[type="date"] { -webkit-appearance: none; appearance: none; min-height: 28px; text-align: left; }

  /* карточка товара */
  .detail .photo-wrap { position: relative; background: var(--card-2); }
  .detail img.hero-photo { width: 100%; height: 300px; object-fit: cover; display: block; cursor: zoom-in; }
  .detail .photo-wrap::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 70px;
    background: linear-gradient(transparent, var(--bg)); pointer-events: none; }
  .detail .body { padding: 4px 16px 16px; display: flex; flex-direction: column; gap: 12px; position: relative; }
  .detail h2 { margin: 0; font-size: 24px; letter-spacing: -.01em; }
  .life { background: var(--card); border-radius: 18px; padding: 12px 14px; box-shadow: var(--shadow); }
  .life .top { display: flex; justify-content: space-between; font-size: 13px; color: var(--hint); margin-bottom: 8px; }
  .life .top b { color: var(--text); font-size: 15px; }
  .lifebar { height: 8px; border-radius: 99px; background: var(--card-2); overflow: hidden; }
  .lifebar i { display: block; height: 100%; border-radius: 99px; transition: width .4s ease; }
  .d-sub { color: var(--hint); font-size: 14px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: -4px; }
  .d-sub svg.i { width: 16px; height: 16px; }
  .batches { display: flex; flex-direction: column; gap: 10px; }
  .batches .group-title { margin-top: 4px; }
  .batch { background: var(--card); border-radius: 18px; padding: 12px 14px; box-shadow: var(--shadow);
    display: flex; flex-direction: column; gap: 10px; border-left: 4px solid var(--green); }
  .batch.s-discount { border-left-color: var(--orange); } .batch.s-writeoff { border-left-color: var(--red); }
  .batch.s-discounted { border-left-color: var(--violet); }
  .b-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .b-date { font-weight: 700; font-size: 17px; display: flex; align-items: center; gap: 6px; }
  .b-date svg.i { width: 17px; height: 17px; }
  .b-days { color: var(--hint); font-size: 14px; margin-top: 2px; }
  .b-days b { color: var(--text); font-weight: 600; }
  .b-actions { display: grid; grid-template-columns: 1fr 1fr auto; gap: 8px; }
  .b-actions .btn.plain { padding: 9px 12px; }
  .b-foot { display: flex; justify-content: space-between; align-items: center; color: var(--hint); font-size: 12px; gap: 8px; }
  .link-del { border: 0; background: none; color: var(--red); font-size: 13px; cursor: pointer; padding: 2px 0; font-family: inherit; }
  .item .meta.dates { color: var(--accent); font-weight: 600; }
  .catalog-btn { padding: 0 16px; margin: 2px 0 6px; }
  .catalog-btn .btn { width: 100%; justify-content: flex-start; font-weight: 600; }
  .catalog-btn .btn svg.i { color: var(--accent); }
  .cat-arrow { margin-left: auto; color: var(--hint); font-size: 24px; line-height: 1; font-weight: 400; }
  .cat-on { color: var(--green); font-weight: 600; }
  .cat-off { color: var(--hint); }
  .kv { background: var(--card); border-radius: 18px; overflow: hidden; box-shadow: var(--shadow); }
  .kv div { display: flex; justify-content: space-between; gap: 12px; padding: 12px 14px; border-bottom: 1px solid var(--sep); font-size: 15px; }
  .kv div:last-child { border-bottom: 0; }
  .kv span:first-child { color: var(--hint); }
  .kv span:last-child { text-align: right; font-weight: 500; }

  /* окно «сколько штук» */
  .sheet-bg { position: fixed; inset: 0; background: rgba(5,10,8,.5); z-index: 40; display: flex; align-items: flex-end;
    animation: fade .15s ease; }
  .sheet { background: var(--bg); width: 100%; border-radius: 24px 24px 0 0; padding: 10px 16px calc(18px + env(safe-area-inset-bottom));
    display: flex; flex-direction: column; gap: 14px; animation: up .2s ease; }
  .sheet .grab { width: 40px; height: 5px; border-radius: 99px; background: var(--sep); margin: 0 auto 4px; }
  .sheet h3 { margin: 0; font-size: 20px; text-align: center; }
  .sheet .stepper { justify-content: center; }
  .sheet .quick { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
  @keyframes fade { from { opacity: 0; } }
  @keyframes up { from { transform: translateY(30px); opacity: .6; } }

  .viewer { position: fixed; inset: 0; background: #000; z-index: 70; display: flex; align-items: center; justify-content: center; }
  .viewer img { max-width: 100%; max-height: 100%; object-fit: contain; }

  .scanner { position: fixed; inset: 0; background: #000; z-index: 50; display: flex; flex-direction: column; }
  .scanner #reader { flex: 1; }
  .scanner #reader video { object-fit: cover; }
  .scanner .bar { padding: 16px; padding-bottom: calc(16px + env(safe-area-inset-bottom)); display: flex; gap: 8px; }
  .scanner .bar .btn { flex: 1; background: #2a2f2c; color: #fff; }
  .scanner .tip { color: #fff; text-align: center; padding: 14px; font-size: 15px; font-weight: 500; }
  .toast { position: fixed; left: 16px; right: 16px; bottom: calc(20px + env(safe-area-inset-bottom)); z-index: 80;
    background: rgba(18,26,22,.94); color: #fff; padding: 13px 16px; border-radius: 16px; font-size: 15px; text-align: center;
    box-shadow: 0 8px 24px rgba(0,0,0,.25); animation: up .2s ease; }
  .loading { text-align: center; padding: 70px 24px; color: var(--hint); }
  .loading .btn { display: inline-flex; min-width: 180px; }
  .spinner { width: 36px; height: 36px; margin: 0 auto 14px; border-radius: 50%; border: 3px solid var(--yellow);
    border-top-color: var(--accent); animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div id="loading" class="loading"><div class="spinner"></div>Загрузка…</div>

<!-- Список -->
<section id="screen-list" class="hidden">
  <div class="hero">
    <div class="brand">
      <div class="logo" data-icon="basket"></div>
      <div><h1>MixMarkt <span>Base</span></h1><div class="sub">Учёт сроков годности</div></div>
    </div>
    <div class="hello" id="hello"></div>
  </div>
  <div class="stats">
    <div class="stat orange" data-filter="discount"><div class="ico" data-icon="tag"></div><b id="c-discount">0</b><span>уценить</span></div>
    <div class="stat red" data-filter="writeoff"><div class="ico" data-icon="alert"></div><b id="c-writeoff">0</b><span>списать</span></div>
    <div class="stat green" data-filter="all"><div class="ico" data-icon="box"></div><b id="c-all">0</b><span>на полке</span></div>
  </div>
  <div class="search"><span data-icon="search"></span><input id="q" type="text" enterkeyhint="search" autocomplete="off" placeholder="Название или цифры штрихкода"><button class="clear hidden" id="q-clear" type="button" aria-label="Очистить">×</button></div>
  <div class="catalog-btn"><button class="btn plain" id="btn-catalog" type="button"><span data-icon="book"></span>Каталог всех товаров<span class="cat-arrow">›</span></button></div>
  <div class="list" id="list"></div>
  <div class="form"><button class="btn" id="btn-add-inline"><span data-icon="plus"></span>Добавить товар</button></div>
</section>

<!-- Каталог: всё, что когда-либо вносили -->
<section id="screen-catalog" class="hidden">
  <header class="plain"><h1>Каталог товаров</h1><div class="sub" id="cat-sub">Загрузка…</div></header>
  <div class="search"><span data-icon="search"></span><input id="cq" type="text" enterkeyhint="search" autocomplete="off" placeholder="Название или цифры штрихкода"><button class="clear hidden" id="cq-clear" type="button" aria-label="Очистить">×</button></div>
  <div class="list" id="clist"></div>
</section>

<!-- Добавление / изменение -->
<section id="screen-add" class="hidden">
  <header class="plain"><h1 id="form-title">Новый товар</h1></header>
  <div class="form">
    <label class="photo-pick" id="photo-pick">
      <span class="icon" data-icon="camera"></span><span id="photo-label">Сфотографировать товар</span>
      <img id="photo-preview" class="hidden" alt="">
      <span class="tag hidden" id="photo-tag"></span>
      <input id="photo-input" type="file" accept="image/*" capture="environment">
    </label>
    <div class="field">
      <label>Штрихкод</label>
      <div class="row">
        <input id="f-barcode" inputmode="numeric" pattern="[0-9]*" placeholder="4601234567890" autocomplete="off">
        <button class="btn small ghost" id="btn-scan" type="button"><span data-icon="barcode"></span>Скан</button>
      </div>
      <div class="hint" id="barcode-hint"></div>
    </div>
    <div class="field">

    </div>
    <div class="field">
      <label>Годен до</label>
      <input id="f-expiry" type="date">

</section>

<!-- Карточка -->
<section id="screen-detail" class="hidden detail">
  <div class="photo-wrap"><img class="hero-photo" id="d-photo" alt=""></div>
  <div class="body">
    <div class="row" style="justify-content:space-between;align-items:flex-start"><h2 id="d-title"></h2><span class="badge" id="d-badge"></span></div>

</div>

<div class="toast hidden" id="toast"></div>

<script>
const tg = window.Telegram && window.Telegram.WebApp;
const $ = (id) => document.getElementById(id);
const inTg = !!(tg && tg.initData);
let state = { products: [], discount_days: 2, discount_percent: 50, today: null, me: "" };
let filter = "all";   // по умолчанию — весь список товаров
let current = null;        // товар в карточке
let editing = null;        // товар, который редактируем (null — новый)
let photoBlob = null;      // новое фото
let knownPhoto = false;    // есть фото из прошлого раза
let screen = "list";

// ---------- иконки и тема ----------
const ICONS = {
  basket: '<path d="M3.5 9.5h17l-1.8 9.2a2 2 0 0 1-2 1.6H7.3a2 2 0 0 1-2-1.6z"/><path d="m8 9.5 3.2-5.5M16 9.5 12.8 4"/><path d="M9.5 13.5v3M14.5 13.5v3"/>',
  tag: '<path d="M3 12V4.5A1.5 1.5 0 0 1 4.5 3H12l9 9-9 9z"/><circle cx="7.5" cy="7.5" r="1.4"/>',
  alert: '<path d="M10.3 4.2 2.6 18a2 2 0 0 0 1.7 3h15.4a2 2 0 0 0 1.7-3L13.7 4.2a2 2 0 0 0-3.4 0z"/><path d="M12 9.5v4.5M12 17.5h.01"/>',
  box: '<path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="m3 8 9 5 9-5M12 13v8"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  camera: '<path d="M4 8.5A1.5 1.5 0 0 1 5.5 7h2.2l1.6-2.2h5.4L16.3 7h2.2A1.5 1.5 0 0 1 20 8.5v9a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 17.5z"/><circle cx="12" cy="13" r="3.4"/>',
  barcode: '<path d="M4 6v12M7.5 6v12M10 6v12M13.5 6v12M16 6v12M20 6v12"/>',
  calendar: '<rect x="4" y="5" width="16" height="15" rx="2.5"/><path d="M4 10h16M9 3v4M15 3v4"/>',
  hash: '<path d="M5 9h14M5 15h14M10 4 8 20M16 4l-2 16"/>',
  cash: '<rect x="3" y="6" width="18" height="12" rx="2.5"/><circle cx="12" cy="12" r="2.6"/><path d="M7 12h.01M17 12h.01"/>',
  trash: '<path d="M4 7h16M10 11v6M14 11v6M9 7V4.5h6V7M6 7l1 12.5A1.5 1.5 0 0 0 8.5 21h7a1.5 1.5 0 0 0 1.5-1.5L18 7"/>',
  edit: '<path d="M4 20h4L19.5 8.5a2.1 2.1 0 0 0-3-3L5 17z"/><path d="m14.5 7.5 3 3"/>',
  check: '<path d="m5 12.5 4.5 4.5L19 7.5"/>',
  sparkle: '<path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M6 18l2.5-2.5M15.5 8.5 18 6"/>',
  layers: '<path d="m12 3 9 5-9 5-9-5z"/><path d="m3 13 9 5 9-5"/>',
  book: '<path d="M5 5a2 2 0 0 1 2-2h12v15H7a2 2 0 0 0-2 2z"/><path d="M5 20a2 2 0 0 0 2 2h12v-4"/><path d="M9 7.5h6M9 11h4"/>',
  image: '<rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><circle cx="9" cy="10" r="1.7"/><path d="m20.5 16-5-5L5 19.5"/>',
};
function icon(name) { return `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${ICONS[name] || ""}</svg>`; }
function fillIcons(root = document) { root.querySelectorAll("[data-icon]").forEach((el) => { el.innerHTML = icon(el.dataset.icon); el.removeAttribute("data-icon"); }); }
fillIcons();

// своя тема: светлая или тёмная — по настройке Telegram, цвета — фирменные
function applyTheme() {
  const dark = tg && tg.colorScheme ? tg.colorScheme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.dataset.theme = dark ? "dark" : "light";
  const css = getComputedStyle(document.documentElement);
  const v = (n) => css.getPropertyValue(n).trim();
  if (!tg) return;
  const calls = [
    () => tg.setHeaderColor(screen === "list" ? v("--hero-top") : v("--bg")),
    () => tg.setBackgroundColor(v("--bg")),
    () => tg.setBottomBarColor && tg.setBottomBarColor(v("--bg")),
    () => tg.MainButton.setParams({ color: v("--yellow"), text_color: v("--on-yellow") }),
  ];
  for (const c of calls) { try { c(); } catch (e) { /* старые версии Telegram */ } }
}
if (tg) { tg.ready(); tg.expand(); try { tg.onEvent("themeChanged", applyTheme); } catch (e) {} }
applyTheme();

function haptic(type) { try { tg.HapticFeedback.notificationOccurred(type); } catch (e) {} }
function tap() { try { tg.HapticFeedback.selectionChanged(); } catch (e) {} }
function toast(text) {
  const t = $("toast"); t.textContent = text; t.classList.remove("hidden");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.add("hidden"), 2600);
}
function alertMsg(text) { if (tg && tg.showAlert) tg.showAlert(text); else alert(text); }
function confirmMsg(text) {
  return new Promise((res) => tg && tg.showConfirm ? tg.showConfirm(text, res) : res(confirm(text)));
}
function esc(s) { return String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function plural(n, one, few, many) {
  n = Math.abs(n); const m10 = n % 10, m100 = n % 100;
  if (m10 === 1 && m100 !== 11) return one;
  if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return few;
  return many;
}
const days = (n) => `${n} ${plural(n, "день", "дня", "дней")}`;
function daysText(d) {
  if (d > 1) return `ещё ${days(d)}`;
  if (d === 1) return "завтра";
  if (d === 0) return "сегодня!";
  return `просрочен ${days(-d)}`;
}
const STAGE = { ok: "в порядке", discount: "уценить", discounted: "уценён", writeoff: "списать", off: "списан", sold: "продан" };
function stepQty(id, d) {
  const el = $(id); const max = +el.max || 9999;
  el.value = Math.min(max, Math.max(1, (parseInt(el.value) || 1) + d)); tap();
}

// Приложение может работать в двух местах:
//  • на серверах Telegram (*.tgcloud.ai) — тогда все запросы идут через Telegram
//    (endpoint «relay»), и сайт PythonAnywhere с телефона вообще не нужен;
//  • прямо на PythonAnywhere (/app) — запросы идут напрямую.
const RELAY = /\.tgcloud\.ai$/.test(location.hostname);

function relayCall(path, method, json) {
  const S = tg && tg.Serverless;
  if (!S) return Promise.reject(new Error("Обновите Telegram до последней версии — эта не умеет открывать приложение."));
  return new Promise((resolve, reject) => {
    S.call("relay", { path, method, init: tg.initData, body: json || {} }, (err, result) => {
      if (err) reject(new Error(err.message || "Нет связи. Попробуйте ещё раз."));
      else resolve(result || {});
    });
  });
}

async function api(path, opts = {}) {
  const method = opts.method || "GET";
  if (RELAY) return relayCall(path, method, opts.json);
  const headers = { "X-Init-Data": tg ? tg.initData : "" };
  let body;
  if (opts.json) { headers["Content-Type"] = "application/json"; body = JSON.stringify(opts.json); }
  let r;
  try {
    r = await fetch(path, { method, headers, body });
  } catch (e) {
    throw new Error("Нет связи с сервером. Проверьте интернет (Wi-Fi или мобильные данные) и попробуйте ещё раз.");
  }
  let data = {};
  try { data = await r.json(); } catch (e) {}
  if (!r.ok) throw new Error(data.error || `Ошибка ${r.status}`);
  return data;
}

// ---------- фото ----------
// Через Telegram картинку нельзя просто вставить ссылкой — её получаем в base64.
const imgCache = new Map();
const imgQueue = []; let imgActive = 0;
function runQueued(fn) {
  return new Promise((resolve, reject) => {
    imgQueue.push(() => fn().then(resolve, reject).finally(() => { imgActive--; nextImg(); }));
    nextImg();
  });
}
function nextImg() { while (imgActive < 3 && imgQueue.length) { imgActive++; imgQueue.shift()(); } }
function getPhoto(url) {
  if (!imgCache.has(url)) {
    const pr = runQueued(() => api(url.replace("/api/photo/", "/api/photo64/")).then((r) => r.data));
    pr.catch(() => imgCache.delete(url));
    imgCache.set(url, pr);
  }
  return imgCache.get(url);
}
function loadImg(el, url) {
  el.dataset.want = url || "";
  if (!url) { el.removeAttribute("src"); return; }
  if (!RELAY || !url.startsWith("/api/photo/")) { el.src = url; return; }
  el.removeAttribute("src");
  getPhoto(url).then((src) => { if (el.dataset.want === url) el.src = src; }).catch(() => {});
}
function hydrateImages(root) { root.querySelectorAll("img[data-photo]").forEach((el) => loadImg(el, el.dataset.photo)); }

// ---------- навигация и кнопки Telegram ----------
let mainHandler = null;
function setMain(text, handler) {
  if (!tg) return;
  if (mainHandler) tg.MainButton.offClick(mainHandler);
  mainHandler = handler;
  if (text && inTg) { tg.MainButton.setText(text); tg.MainButton.onClick(handler); tg.MainButton.show(); }
  else tg.MainButton.hide();
}
function show(name) {
  screen = name;
  applyTheme();
  for (const s of ["list", "add", "detail", "catalog"]) $("screen-" + s).classList.toggle("hidden", s !== name);
  window.scrollTo(0, 0);
  if (tg) { name === "list" ? tg.BackButton.hide() : tg.BackButton.show(); }
  if (name === "list" || name === "catalog") setMain("＋ Добавить товар", () => openForm(null));
  else if (name === "add") setMain(editing ? "Сохранить изменения" : "Сохранить", save);
  else setMain(null);
  $("btn-add-inline").classList.toggle("hidden", inTg);
  $("btn-save-inline").classList.toggle("hidden", inTg);
}
function goBack() {
  if (!$("viewer").classList.contains("hidden")) return $("viewer").classList.add("hidden");
  if (!$("qty-sheet").classList.contains("hidden")) return closeSheet();
  if (!$("scanner").classList.contains("hidden")) return closeScanner();
  if (screen === "add" && formFromCard && cardOf(formFromCard)) return openCard(formFromCard);
  if (screen === "add" && formFromCatalog) return show("catalog");
  show("list");
}
if (tg) tg.BackButton.onClick(goBack);

// ---------- список ----------
// Версия страницы (сервер вписывает её вместо метки). Если сервер уже обновился, а Telegram
// развернул старую страницу из памяти, — перезагружаемся, чтобы не работать со старым экраном.
const PAGE_VERSION = "__APP_VERSION__";
function reloadIfOutdated(serverVersion) {
  if (!serverVersion || PAGE_VERSION.startsWith("__") || serverVersion === PAGE_VERSION) return false;
  let tried = null;
  try { tried = sessionStorage.getItem("reloaded_for"); } catch (e) {}
  if (tried === serverVersion) return false;          // уже пробовали — не зацикливаемся
  try { sessionStorage.setItem("reloaded_for", serverVersion); } catch (e) {}
  location.reload();
  return true;
}

async function load() {
  try {
    state = await api("/api/state");
  } catch (e) {
    fatal(e.message);
    return false;
  }
  if (screen !== "add" && reloadIfOutdated(state.app_version)) return false;   // форму не теряем
  $("loading").classList.add("hidden");
  $("hello").textContent = `Привет, ${state.me}! Скидка ${state.discount_percent}% ставится за ${days(state.discount_days)} до конца срока.`;
  renderList();
  return true;
}

function groupOf(p) {
  const d = p.days_left;
  if (d <= 0) return ["writeoff", "Списать сегодня", "red"];
  if (d === 1) return ["d1", "Завтра", "orange"];
  if (d <= state.discount_days) return ["d2", `Через ${days(d)}`, "orange"];
  if (d <= 7) return ["week", "На этой неделе", ""];
  return ["later", "Позже", ""];
}

// ---------- карточки: один штрихкод = одна карточка, внутри — партии с разными сроками ----------
const STAGE_PRIO = { writeoff: 4, discount: 3, discounted: 2, ok: 1 };
function buildCards(products) {
  const map = new Map();
  for (const p of products) {
    if (!map.has(p.barcode)) map.set(p.barcode, []);
    map.get(p.barcode).push(p);
  }
  return [...map.values()].map((batches) => {
    batches.sort((x, y) => x.days_left - y.days_left || x.id - y.id);
    const newest = [...batches].sort((x, y) => y.id - x.id);
    const named = newest.find((x) => x.name) || newest[0];
    const stage = batches.reduce((st, x) => (STAGE_PRIO[x.stage] > STAGE_PRIO[st] ? x.stage : st), "ok");
    return {
      barcode: batches[0].barcode,
      title: named.title,
      photo: (newest.find((x) => x.photo) || {}).photo || null,
      batches,
      urgent: batches[0],
      stage,
      qty: batches.reduce((n, x) => n + x.quantity, 0),
      days_left: batches[0].days_left,
    };
  }).sort((x, y) => x.days_left - y.days_left || x.title.localeCompare(y.title));
}
let cards = [];

// Поиск: по названию, полному штрихкоду или последним цифрам.
// Возвращает «насколько подходит»: 0 — не подходит, больше — лучше.
function matchScore(c, q) {
  if (!q) return 0;
  const digits = q.replace(/\s/g, "");
  if (/^\d+$/.test(digits)) {
    if (c.barcode === digits) return 4;
    if (c.barcode.endsWith(digits)) return 3;
    if (c.barcode.includes(digits)) return 2;
  }
  return (c.title || "").toLowerCase().includes(q) ? 1 : 0;
}
function markMatch(text, part) {
  const i = part ? text.toLowerCase().lastIndexOf(part.toLowerCase()) : -1;
  if (i < 0) return esc(text);
  return esc(text.slice(0, i)) + `<mark>${esc(text.slice(i, i + part.length))}</mark>` + esc(text.slice(i + part.length));
}
const shortDate = (p) => p.expiry_text.slice(0, 5);

function itemHtml(c, q, found) {
  const digits = q.replace(/\s/g, "");
  const code = found && /^\d+$/.test(digits) ? markMatch(c.barcode, digits) : esc(c.barcode);
  const title = found && !/^\d+$/.test(digits) ? markMatch(c.title, q) : esc(c.title);
  const u = c.urgent;
  const more = c.batches.length > 1
    ? `<div class="meta dates">${icon("layers")}${c.batches.length} ${plural(c.batches.length, "срок", "срока", "сроков")}: ${c.batches.map(shortDate).join(" · ")}</div>` : "";
  return `
    <div class="item s-${c.stage}${found ? " found" : ""}" data-code="${esc(c.barcode)}" onclick="openCard('${esc(c.barcode)}')">
      ${c.photo ? `<img class="thumb" data-photo="${c.photo}?thumb=1" alt="">` : `<div class="thumb">${icon("image")}</div>`}
      <div class="info">
        <div class="title">${title}</div>
        <div class="meta">${icon("calendar")}до ${u.expiry_text} · ${daysText(u.days_left)}</div>
        ${more}
        <div class="meta">${icon("barcode")}${code}</div>
      </div>
      <span class="badge b-${c.stage}">${STAGE[c.stage]}</span>
    </div>`;
}

function groupedHtml(items) {
  let html = "", lastGroup = null;
  for (const c of items) {
    const [g, title, color] = groupOf(c);
    if (g !== lastGroup) {
      const n = items.filter((x) => groupOf(x)[0] === g).length;
      html += `<div class="group-title ${color}"><span>${title}</span><span class="n">${n}</span></div>`;
      lastGroup = g;
    }
    html += itemHtml(c, "", false);
  }
  return html;
}

function renderList() {
  cards = buildCards(state.products);
  const has = (st) => (c) => c.batches.some((b) => b.stage === st);
  $("c-discount").textContent = cards.filter(has("discount")).length;
  $("c-writeoff").textContent = cards.filter(has("writeoff")).length;
  $("c-all").textContent = cards.length;
  document.querySelectorAll(".stat").forEach((el) => el.classList.toggle("active", el.dataset.filter === filter));

  let items = cards;
  if (filter === "discount") items = cards.filter(has("discount"));
  else if (filter === "writeoff") items = cards.filter(has("writeoff"));

  const list = $("list");
  const q = $("q").value.trim().toLowerCase();
  if (!items.length && !q) {
    const msg = filter === "all" ? "Пока нет товаров.<br>Нажмите «Добавить товар»."
      : filter === "discount" ? "Уценять сейчас нечего" : "Списывать сегодня нечего";
    list.innerHTML = `<div class="empty"><div class="big">${icon(filter === "all" ? "box" : "check")}</div>${msg}</div>`;
    if (filter !== "all" && cards.length) list.innerHTML += `<div class="empty" style="padding-top:0"><button class="chip" onclick="setFilter('${filter}')">Показать все товары (${cards.length})</button></div>`;
    return;
  }

  let html = "";
  if (q) {
    // найденные — наверх и подсвечены, остальной список — ниже
    const found = cards.map((c) => [matchScore(c, q), c]).filter(([sc]) => sc > 0)
      .sort((a, b) => b[0] - a[0] || a[1].days_left - b[1].days_left).map(([, c]) => c);
    if (found.length) {
      html += `<div class="group-title found-title"><span>Найдено</span><span class="n">${found.length}</span></div>`;
      html += found.map((c) => itemHtml(c, q, true)).join("");
    } else {
      html += `<div class="not-found">${icon("search")}<span>Товар «${esc($("q").value.trim())}» не найден.<br>Проверьте цифры или добавьте товар.</span></div>`;
    }
    const rest = items.filter((c) => !found.includes(c));
    if (rest.length) html += `<div class="rest">${groupedHtml(rest)}</div>`;
  } else {
    html = groupedHtml(items);
  }
  list.innerHTML = html;
  hydrateImages(list);
}
function setFilter(f) { filter = filter === f ? "all" : f; tap(); renderList(); window.scrollTo({ top: 0, behavior: "smooth" }); }
document.querySelectorAll(".stat").forEach((el) => el.addEventListener("click", () => setFilter(el.dataset.filter)));
$("q").addEventListener("input", () => { $("q-clear").classList.toggle("hidden", !$("q").value); renderList(); window.scrollTo({ top: 0 }); });
$("q").addEventListener("keydown", (e) => { if (e.key === "Enter") $("q").blur(); });
$("q-clear").addEventListener("click", () => { $("q").value = ""; $("q-clear").classList.add("hidden"); renderList(); });
$("btn-add-inline").addEventListener("click", () => openForm(null));

// обновляем список, когда приложение снова открыли
document.addEventListener("visibilitychange", () => { if (!document.hidden && screen === "list") load(); });

// ---------- карточка товара ----------
let currentCode = null;   // штрихкод открытой карточки
function cardOf(code) { return buildCards(state.products).find((c) => c.barcode === code) || null; }
function openDetail(id) {   // открыть карточку, в которой лежит партия #id
  const p = state.products.find((x) => x.id === id);
  if (p) openCard(p.barcode); else backToCard();
}
function backToCard() {
  if (currentCode && cardOf(currentCode)) openCard(currentCode); else show("list");
}

function batchHtml(b) {
  const pct = Math.max(0, Math.min(100, b.days_left / 14 * 100));
  const color = b.days_left <= 0 ? "var(--red)" : b.days_left <= state.discount_days ? "var(--orange)" : "var(--green)";
  const who = [b.added_by && `внёс(ла) ${b.added_by}`, b.discount_by && `скидка — ${b.discount_by}`].filter(Boolean).join(" · ");
  const canDiscount = b.status === "active" && b.days_left > 0 && b.days_left <= state.discount_days;
  return `
    <div class="batch s-${b.stage}" data-id="${b.id}">
      <div class="b-top">
        <div><div class="b-date" style="color:${color}">${icon("calendar")}до ${b.expiry_text}</div>
          <div class="b-days">${daysText(b.days_left)}</div></div>
        <span class="badge b-${b.stage}">${STAGE[b.stage]}</span>
      </div>
      <div class="lifebar"><i style="width:${Math.max(pct, 4)}%;background:${color}"></i></div>
      ${canDiscount ? `<button class="btn orange small" onclick="batchAct(${b.id},'discount')">${icon("tag")}Скидка ${state.discount_percent}% поставлена</button>` : ""}
      <div class="b-actions">
        <button class="btn teal small" onclick="batchAct(${b.id},'sold')">${icon("cash")}Продано</button>
        <button class="btn red small" onclick="batchAct(${b.id},'writeoff')">${icon("trash")}Списать</button>
        <button class="btn plain small" onclick="batchAct(${b.id},'edit')" aria-label="Изменить">${icon("edit")}</button>
      </div>
      <div class="b-foot"><span>${esc(who)}</span><button class="link-del" onclick="batchAct(${b.id},'delete')">удалить</button></div>
    </div>`;
}

function openCard(code) {
  const c = cardOf(code);
  if (!c) { show("list"); return; }
  currentCode = code;
  current = c.urgent;
  loadImg($("d-photo"), c.photo);
  $("d-photo").classList.toggle("hidden", !c.photo);
  $("d-title").textContent = c.title;
  $("d-badge").className = `badge b-${c.stage}`;
  $("d-badge").textContent = STAGE[c.stage];
  $("d-sub").innerHTML = `${icon("barcode")}${esc(c.barcode)}` +
    (c.batches.length > 1 ? ` · ${c.batches.length} ${plural(c.batches.length, "срок", "срока", "сроков")}` : "");
  $("d-batches").innerHTML = `<div class="group-title"><span>Сроки годности</span><span class="n">${c.batches.length}</span></div>` +
    c.batches.map(batchHtml).join("");
  show("detail");
}
$("d-photo").addEventListener("click", () => { const c = cardOf(currentCode); if (c) { loadImg($("viewer-img"), c.photo); $("viewer").classList.remove("hidden"); } });
$("d-add-batch").addEventListener("click", () => {
  const c = cardOf(currentCode);
  if (c) openForm(null, { barcode: c.barcode, name: c.title, photo: c.photo });
});

function batchAct(id, kind) {
  const b = state.products.find((x) => x.id === id);
  if (!b) return backToCard();
  current = b;
  if (kind === "discount") return markDiscount();
  if (kind === "edit") return openForm(b);
  if (kind === "delete") return removeItem();
  return openSheet(kind);
}

// После ошибки показываем свежие данные: действие могло уже записаться,
// а партия — уйти с полки. Тогда открываем карточку заново (или список).
async function refreshAfterError(msg) {
  haptic("error");
  alertMsg(msg);
  if (await load()) backToCard();
}

async function markDiscount() {
  if (!(await confirmMsg(`Отметить, что на «${current.title}» (до ${current.expiry_text}) поставлена скидка ${state.discount_percent}%?`))) return;
  try {
    await api(`/api/products/${current.id}/discount`, { method: "POST" });
    haptic("success"); toast("🏷 Скидка отмечена");
    await load(); backToCard();
  } catch (e) { refreshAfterError(e.message); }
}

// продано / списать — всю партию (количество не ведём: одна запись = одна партия со своим сроком)
let sheetKind = null;
function openSheet(kind) { sheetKind = kind; return doTake(); }
function closeSheet() { $("qty-sheet").classList.add("hidden"); }

async function doTake() {
  const kind = sheetKind;
  const text = kind === "sold" ? `Отметить, что «${current.title}» (до ${current.expiry_text}) продан?`
    : `Списать «${current.title}» (до ${current.expiry_text})?`;
  if (!(await confirmMsg(text))) return;
  try {
    await api(`/api/products/${current.id}/${kind}`, { method: "POST", json: {} });
    haptic("success");
    toast(kind === "sold" ? "💰 Отмечено: продано" : "🗑 Списано");
    await load();
    backToCard();
  } catch (e) { refreshAfterError(e.message); }
}

async function removeItem() {
  if (!(await confirmMsg(`Удалить партию «${current.title}» (до ${current.expiry_text})? Это для ошибочно добавленных записей.`))) return;
  try {
    await api(`/api/products/${current.id}/delete`, { method: "POST" });
    toast("Запись удалена"); await load(); backToCard();
  } catch (e) { refreshAfterError(e.message); }
}

// ---------- каталог: все товары, которые когда-либо вносили ----------
let catalog = [];
async function openCatalog() {
  show("catalog");
  $("cat-sub").textContent = "Загрузка…";
  try {
    catalog = (await api("/api/catalog")).items;
  } catch (e) { $("cat-sub").textContent = ""; alertMsg(e.message); return; }
  const onShelf = catalog.filter((c) => c.on_shelf > 0).length;
  $("cat-sub").textContent = `${catalog.length} ${plural(catalog.length, "товар", "товара", "товаров")} · на полке сейчас ${onShelf}`;
  renderCatalog();
}
function renderCatalog() {
  const q = $("cq").value.trim().toLowerCase();
  const digits = q.replace(/\s/g, "");
  let items = catalog;
  if (q) items = catalog.map((c) => [matchScore(c, q), c]).filter(([sc]) => sc > 0)
    .sort((a, b) => b[0] - a[0] || a[1].title.localeCompare(b[1].title)).map(([, c]) => c);
  const list = $("clist");
  if (!catalog.length) { list.innerHTML = `<div class="empty"><div class="big">${icon("book")}</div>Каталог пока пуст.<br>Добавьте первый товар.</div>`; return; }
  if (!items.length) { list.innerHTML = `<div class="not-found">${icon("search")}<span>Товар «${esc($("cq").value.trim())}» не найден в каталоге.</span></div>`; return; }
  list.innerHTML = items.map((c) => {
    const code = q && /^\d+$/.test(digits) ? markMatch(c.barcode, digits) : esc(c.barcode);
    const title = q && !/^\d+$/.test(digits) ? markMatch(c.title, q) : esc(c.title);
    const status = c.on_shelf > 0
      ? `<span class="cat-on">на полке${c.dates_on_shelf > 1 ? ` · ${c.dates_on_shelf} ${plural(c.dates_on_shelf, "срок", "срока", "сроков")}` : ""}</span>`
      : `<span class="cat-off">сейчас нет на полке</span>`;
    return `
    <div class="item cat-item${q ? " found" : ""}" onclick="catalogTap('${esc(c.barcode)}')">
      ${c.photo ? `<img class="thumb" data-photo="${c.photo}?thumb=1" alt="">` : `<div class="thumb">${icon("image")}</div>`}
      <div class="info">
        <div class="title">${title}</div>
        <div class="meta">${icon("barcode")}${code}</div>
        <div class="meta">${status}</div>
      </div>
      <span class="cat-arrow">›</span>
    </div>`;
  }).join("");
  hydrateImages(list);
}
function catalogTap(code) {
  if (cardOf(code)) return openCard(code);          // есть на полке — открыть карточку
  const c = catalog.find((x) => x.barcode === code);
  openForm(null, { barcode: c.barcode, name: c.title, photo: c.photo });   // нет — сразу внести новый срок
}
$("btn-catalog").addEventListener("click", () => { tap(); openCatalog(); });
$("cq").addEventListener("input", () => { $("cq-clear").classList.toggle("hidden", !$("cq").value); renderCatalog(); window.scrollTo({ top: 0 }); });
$("cq").addEventListener("keydown", (e) => { if (e.key === "Enter") $("cq").blur(); });
$("cq-clear").addEventListener("click", () => { $("cq").value = ""; $("cq-clear").classList.add("hidden"); renderCatalog(); });

// ---------- добавление и изменение ----------
function isoDate(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; }
function addDays(n) { const d = new Date(state.today + "T12:00:00"); d.setDate(d.getDate() + n); return isoDate(d); }

function setPreview(src, tag) {
  loadImg($("photo-preview"), src);
  $("photo-preview").classList.toggle("hidden", !src);
  $("photo-tag").textContent = tag || "";
  $("photo-tag").classList.toggle("hidden", !tag);
}

// openForm(партия) — изменить; openForm(null) — новый товар;
// openForm(null, {barcode, name, photo}) — новый срок для уже известного товара (из карточки)
let formFromCard = null;
let formFromCatalog = false;
function openForm(p, preset = null) {
  editing = p;
  formFromCatalog = screen === "catalog";
  formFromCard = preset ? preset.barcode : (p ? p.barcode : null);
  photoBlob = null; knownPhoto = !!(preset && preset.photo); lastLookup = null;
  $("photo-input").value = "";
  $("form-title").textContent = p ? `Изменить срок до ${p.expiry_text}` : preset ? "Новый срок" : "Новый товар";
  $("photo-label").textContent = p || preset ? "Переснять фото" : "Сфотографировать товар";
  const photo = p ? p.photo : preset ? preset.photo : null;
  setPreview(photo, p ? "Нажмите, чтобы переснять" : preset && preset.photo ? "Фото товара — можно не переснимать" : null);
  $("f-barcode").value = p ? p.barcode : preset ? preset.barcode : "";
  $("f-name").value = p ? (p.name || "") : preset ? (preset.name || "") : "";
  $("f-expiry").value = p ? p.expiry : "";
  $("barcode-hint").textContent = preset ? "Новый срок добавится в карточку этого товара" : "";
  $("barcode-hint").className = preset ? "hint ok" : "hint";
  if (preset) lastLookup = preset.barcode;
  $("f-expiry").min = state.today;
  const chips = [[1, "завтра"], [3, "+3 дня"], [5, "+5 дней"], [7, "+неделя"], [14, "+2 недели"], [30, "+месяц"]];
  $("chips").innerHTML = chips.map(([n, t]) => `<button class="chip" type="button" onclick="$('f-expiry').value='${addDays(n)}'">${t}</button>`).join("");
  show("add");
}

// автоподстановка: этот штрихкод уже вносили?
let lastLookup = null;
async function lookupBarcode() {
  const code = $("f-barcode").value.replace(/\s/g, "");
  if (editing || !/^\d{8,14}$/.test(code) || code === lastLookup) return;
  lastLookup = code;
  try {
    const r = await api(`/api/lookup/${code}`);
    if (!r.found || $("f-barcode").value.replace(/\s/g, "") !== code) return;
    if (r.name && !$("f-name").value) $("f-name").value = r.name;
    let hint = `🔁 Уже вносили${r.name ? `: «${r.name}»` : ""} — новый срок добавится в ту же карточку.`;
    if (r.photo && !photoBlob) {
      knownPhoto = true;
      setPreview(r.photo, "Фото из прошлого раза — можно переснять");
      hint += " Фото можно не делать.";
    }
    if (r.on_shelf && r.on_shelf.length)
      hint += ` Сейчас на полке: ${r.on_shelf.map((x) => `до ${x.expiry_text}`).join("; ")}.`;
    $("barcode-hint").textContent = hint; $("barcode-hint").className = "hint ok";
    haptic("success");
  } catch (e) { /* не страшно — просто без подсказки */ }
}
$("f-barcode").addEventListener("input", () => { clearTimeout(lookupBarcode._t); lookupBarcode._t = setTimeout(lookupBarcode, 400); });
$("f-barcode").addEventListener("blur", lookupBarcode);

// уменьшаем фото перед отправкой (фото с iPhone весят несколько МБ)
function resizeImage(file, max = 1280) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      c.toBlob((b) => b ? resolve(b) : reject(new Error("Не удалось обработать фото")), "image/jpeg", 0.8);
      URL.revokeObjectURL(img.src);
    };
    img.onerror = () => reject(new Error("Не удалось открыть фото"));
    img.src = URL.createObjectURL(file);
  });
}

$("photo-input").addEventListener("change", async (e) => {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  try {
    photoBlob = await resizeImage(file);
    setPreview(URL.createObjectURL(photoBlob), null);
  } catch (err) { alertMsg(err.message); return; }
  // пробуем найти штрихкод прямо на фото товара
  if (!$("f-barcode").value && window.Html5Qrcode) {
    $("barcode-hint").textContent = "Ищу штрихкод на фото…"; $("barcode-hint").className = "hint";
    try {
      const reader = new Html5Qrcode("reader", { formatsToSupport: barcodeFormats(), verbose: false });
      const code = await reader.scanFile(file, false);
      reader.clear();
      if (/^\d{4,20}$/.test(code)) {
        $("f-barcode").value = code;
        $("barcode-hint").textContent = "✅ Штрихкод найден на фото"; $("barcode-hint").className = "hint ok";
        haptic("success");
        lookupBarcode();
      } else $("barcode-hint").textContent = "";
    } catch (err) { $("barcode-hint").textContent = "На фото штрихкод не найден — нажмите «Скан» или введите цифры"; }
  }
});

function barcodeFormats() {
  const F = window.Html5QrcodeSupportedFormats;
  return F ? [F.EAN_13, F.EAN_8, F.UPC_A, F.UPC_E, F.CODE_128, F.CODE_39, F.ITF] : undefined;
}

let scanner = null;
async function openScanner() {
  if (!window.Html5Qrcode) { alertMsg("Сканер не загрузился. Введите цифры вручную."); return; }
  $("scanner").classList.remove("hidden");
  setMain(null);
  scanner = new Html5Qrcode("reader", { formatsToSupport: barcodeFormats(), verbose: false,
    experimentalFeatures: { useBarCodeDetectorIfSupported: true } });
  try {
    await scanner.start({ facingMode: "environment" },
      { fps: 12, qrbox: (w, h) => ({ width: Math.floor(w * 0.85), height: Math.floor(Math.min(h, w) * 0.4) }) },
      (text) => {
        if (!/^\d{4,20}$/.test(text)) return;
        $("f-barcode").value = text;
        $("barcode-hint").textContent = "✅ Штрихкод отсканирован"; $("barcode-hint").className = "hint ok";
        haptic("success");
        closeScanner();
        lookupBarcode();
      });
  } catch (e) {
    closeScanner();
    alertMsg("Нет доступа к камере. Разрешите доступ к камере для Telegram в настройках iPhone или введите цифры вручную.");
  }
}
async function closeScanner() {
  $("scanner").classList.add("hidden");
  if (scanner) { try { await scanner.stop(); } catch (e) {} try { scanner.clear(); } catch (e) {} scanner = null; }
  if (screen === "add") setMain(editing ? "Сохранить изменения" : "Сохранить", save);
}
$("btn-scan").addEventListener("click", (e) => { e.preventDefault(); openScanner(); });
$("btn-scan-close").addEventListener("click", closeScanner);
$("btn-save-inline").addEventListener("click", () => save());

function blobToDataURL(blob) {
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onload = () => resolve(fr.result);
    fr.onerror = () => reject(new Error("Не удалось прочитать фото"));
    fr.readAsDataURL(blob);
  });
}

let saving = false;
async function save() {
  if (saving) return;
  const barcode = $("f-barcode").value.replace(/\s/g, "");
  const expiry = $("f-expiry").value;
  if (!editing && !photoBlob && !knownPhoto) return alertMsg("Сфотографируйте товар 📸");
  if (!/^\d{4,20}$/.test(barcode)) return alertMsg("Введите штрихкод (только цифры) или отсканируйте его");
  if (!expiry) return alertMsg("Укажите срок годности 📅");
  if (expiry < state.today) return alertMsg("Эта дата уже прошла — такой товар нужно списать");

  const payload = { barcode, name: $("f-name").value.trim(), expiry, quantity: 1 };
  saving = true;
  if (tg) tg.MainButton.showProgress();
  try {
    const url = editing ? `/api/products/${editing.id}/edit` : "/api/products";
    if (photoBlob) payload.photo_b64 = await blobToDataURL(photoBlob);
    const r = await api(url, { method: "POST", json: payload });
    haptic("success");
    toast(editing ? "✏️ Изменения сохранены" : "✅ Товар добавлен");
    await load();
    editing = null;
    // открыли форму из карточки (новый срок / изменение) — возвращаемся в карточку
    if (formFromCard && cardOf(barcode)) openCard(barcode);
    else { filter = "all"; renderList(); show("list"); }
  } catch (e) { haptic("error"); alertMsg(e.message); }
  finally { saving = false; if (tg) tg.MainButton.hideProgress(); }
}

// ---------- старт ----------
function fatal(msg) {
  for (const s of ["list", "add", "detail", "catalog"]) $("screen-" + s).classList.add("hidden");
  if (tg) { tg.MainButton.hide(); tg.BackButton.hide(); }
  const l = $("loading");
  l.classList.remove("hidden");
  l.innerHTML = `<div class="empty" style="padding:0"><div class="big" style="background:var(--red-soft);color:var(--red)">${icon("alert")}</div></div>
    <div style="margin:4px 0 18px;color:var(--text)">${esc(msg)}</div>
    <button class="btn" onclick="location.reload()">Повторить</button>
    ${tg && tg.close ? `<div style="margin-top:8px"><button class="btn ghost" onclick="Telegram.WebApp.close()">Закрыть</button></div>` : ""}`;
}
(async () => {
  if (!window.Telegram) {
    fatal("Не загрузился модуль Telegram — похоже, пропал интернет. Проверьте связь и нажмите «Повторить».");
    return;
  }
  if (!inTg) {
    $("loading").innerHTML = "Это приложение открывается внутри Telegram:<br>напишите <b>/app</b> в рабочей группе и нажмите кнопку.";
    return;
  }
  if (await load()) show("list");
})();
</script>
