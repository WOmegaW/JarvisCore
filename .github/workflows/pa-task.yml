name: Setup PythonAnywhere task

# Ручной запуск: создать/исправить ежедневное задание PythonAnywhere для утреннего плана (07:00 UTC).
on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ежедневное задание bot.daily в 07:00 UTC
        env:
          PA_API_TOKEN: ${{ secrets.PA_API_TOKEN }}
        run: python3 scripts/ensure_pa_task.py
